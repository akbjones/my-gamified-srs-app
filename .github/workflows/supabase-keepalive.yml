# Keeps the Supabase free-tier project from auto-pausing (~7 days idle).
# Pings the sync_pull RPC with a dummy code every 3 days — a real API call
# counts as project activity; the dummy code matches no rows and returns [].
#
# The URL + publishable key are client-safe by design (they ship in the
# browser bundle; RLS + hashed-code RPCs are the security boundary), so they
# can live in plain text here. NOTE: scheduled workflows only run from the
# DEFAULT branch — this activates once merged to main. Manual run: Actions →
# supabase-keepalive → Run workflow.
name: supabase-keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'   # every 3 days at 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping sync_pull
        run: |
          set -e
          RESP=$(curl -sf -X POST \
            'https://zopiqgboodkurfphazma.supabase.co/rest/v1/rpc/sync_pull' \
            -H 'apikey: sb_publishable_pLX3s16tqJ4_fzaL4Io7VQ_ZdDDEd4g' \
            -H 'Authorization: Bearer sb_publishable_pLX3s16tqJ4_fzaL4Io7VQ_ZdDDEd4g' \
            -H 'Content-Type: application/json' \
            -d '{"p_code":"KEEPALIVE-PING-00000000"}')
          echo "response: $RESP"
          test "$RESP" = "[]"   # dummy code must match nothing
