<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Lambda λ — two clean strokes, bold and centered -->
  <g stroke="white" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Long diagonal from upper-left apex to lower-right -->
    <path d="M 178 138 L 392 384"/>
    <!-- Short diagonal branching off the long one, going to lower-left -->
    <path d="M 250 222 L 128 384"/>
  </g>
</svg>
