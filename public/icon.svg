<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <!-- Violet rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Stylized serif lowercase λ — italic serif character so it inherits
       proper apex shape, terminal serifs, and stroke contrast from the font. -->
  <text
    x="256"
    y="395"
    font-family='"Times New Roman", "Liberation Serif", "DejaVu Serif", Georgia, serif'
    font-size="440"
    font-style="italic"
    font-weight="700"
    fill="white"
    text-anchor="middle"
  >λ</text>
</svg>
